name: Sync Kellblog Podcast

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg

      - name: Install Python package
        run: uv sync --frozen --extra chatterbox

      - name: Restore catalog from R2
        run: uv run kellblog-audio restore-catalog || true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

      - name: Restore QA reports from R2
        run: uv run kellblog-audio restore-qa || true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

      - name: Ingest new posts
        run: uv run kellblog-audio ingest
        env:
          SLACK_WEBHOOK_URL_KELLBLOG: ${{ secrets.SLACK_WEBHOOK_URL_KELLBLOG }}

      - name: Synthesize pending
        run: uv run kellblog-audio synthesize --pending
        env:
          KELLBLOG_TTS_PROVIDER: chatterbox
          KELLBLOG_CHATTERBOX_EXAGGERATION: "0.4"
          KELLBLOG_CHATTERBOX_DEVICE: cpu

      - name: Publish to R2
        run: uv run kellblog-audio publish
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          KELLBLOG_AUDIO_PUBLIC_URL: ${{ vars.KELLBLOG_AUDIO_PUBLIC_URL }}
          KELLBLOG_APPLE_PODCASTS_ID: ${{ vars.KELLBLOG_APPLE_PODCASTS_ID }}
          KELLBLOG_SPOTIFY_SHOW_ID: ${{ vars.KELLBLOG_SPOTIFY_SHOW_ID }}
          KELLBLOG_AMAZON_MUSIC_URL: ${{ vars.KELLBLOG_AMAZON_MUSIC_URL }}
          KELLBLOG_IHEART_URL: ${{ vars.KELLBLOG_IHEART_URL }}

      - name: Check audio sanity (alerts Slack on findings)
        run: uv run kellblog-audio check-audio
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL_KELLBLOG: ${{ secrets.SLACK_WEBHOOK_URL_KELLBLOG }}

      - name: Backup catalog
        run: uv run kellblog-audio backup-catalog
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

      - name: Backup QA reports
        run: uv run kellblog-audio backup-qa
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

      - name: Alert Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL_KELLBLOG: ${{ secrets.SLACK_WEBHOOK_URL_KELLBLOG }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$SLACK_WEBHOOK_URL_KELLBLOG" ] || exit 0
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\": \":rotating_light: Kellblog Audio nightly sync failed: $RUN_URL\"}" \
            "$SLACK_WEBHOOK_URL_KELLBLOG" || true
